name: Oracle Native Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/oracle-diff/**'
      - 'packages/calc/**'
      - 'apps/web/public/data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/oracle-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-smoke:
    name: Pinned Native PoB Oracle Smoke (GitHub-hosted Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git luarocks lua5.1 liblua5.1-0-dev unzip

      - name: Cache pinned upstream PoB, LuaJIT, and UTF-8 rock
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream-pob
            .cache/upstream-pob2
            .cache/luajit-src
            .cache/luajit-rocks
          key: oracle-native-linux-v2-${{ hashFiles('scripts/oracle-diff/oracle-pins.json') }}

      - name: Fetch, build, and verify exact pinned native inputs
        run: pnpm oracle:setup

      - name: Run pinned native PoE 1/2 smoke and repeatability checks
        run: pnpm oracle:smoke -- --out /tmp/oracle-smoke-native.json

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-native-smoke-${{ github.run_id }}
          path: /tmp/oracle-smoke-native.json
          if-no-files-found: warn
